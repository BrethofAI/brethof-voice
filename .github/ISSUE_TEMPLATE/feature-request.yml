name: 💡 Feature Request
description: Suggest a feature, improvement, or new capability
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before opening a new request, please **search existing issues** — adding a 👍 to an existing request helps us prioritise more than a duplicate.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or workflow that's currently painful or impossible. Be specific.
      placeholder: |
        "I'm in meetings where speakers switch between English and Polish mid-sentence. The current single-language transcription splits them awkwardly — I'd like a multi-language mode that detects the switch in-stream."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: What would you like to see?
      description: Describe the feature. Focus on the user experience; don't worry about implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you currently use, or other tools that solve this differently.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Voice Pro is this about?
      options:
        - Transcription (file / mic / system audio)
        - Translation (38-language)
        - Voice keyboard (push-to-talk dictation)
        - LoRA fine-tune (personal-voice adapter)
        - MCP server (--mcp tools)
        - Hotwords / vocabulary biasing
        - Subtitles (SRT / VTT)
        - Settings / preferences
        - Installer / first-run experience
        - Other (describe below)
    validations:
      required: true
