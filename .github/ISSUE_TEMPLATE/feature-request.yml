name: 💡 Feature Request
description: Suggest a feature, improvement, or new capability
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before opening a new request, please **search existing issues** — adding a 👍 to an existing request helps us prioritise more than a duplicate.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or workflow that's currently painful or impossible. Be specific.
      placeholder: |
        "When I'm in a meeting and need to switch between English and Polish, I have to manually change the language each time, which interrupts the flow."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: What would you like to see?
      description: Describe the feature. Don't worry about implementation — focus on the user experience.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you currently use, or other tools that solve this differently.

  - type: dropdown
    id: tier_relevance
    attributes:
      label: Which tier should have this?
      options:
        - Free + Pro (everyone)
        - Pro only (it's a power-user feature)
        - Pro only (it has a real cost — compute, storage, support)
        - Not sure
    validations:
      required: true

  - type: input
    id: would-you-pay
    attributes:
      label: Would you pay for this as a Pro feature?
      description: Honest answer helps us prioritise. "No" is a valid answer.
      placeholder: "yes / no / maybe"
