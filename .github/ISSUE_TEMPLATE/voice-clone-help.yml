name: 🎙️ Voice Clone (LoRA) — help / issue
description: Specific to LoRA voice training and personal-voice fine-tuning (Pro feature)
title: "[Voice Clone] "
labels: ["voice-clone", "lora", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Brethof Voice Pro's LoRA voice-training is the power-user feature — it's the one where things go sideways most often (training data quality, GPU memory, language coverage). We triage these closely. Please be specific.

  - type: input
    id: version
    attributes:
      label: Brethof Voice Pro version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      options:
        - NVIDIA RTX 5090
        - NVIDIA RTX 5080
        - NVIDIA RTX 4090
        - NVIDIA RTX 4080 / 4070 / 4060
        - NVIDIA RTX 3000 series
        - NVIDIA RTX 2000 series
        - AMD GPU (specify model)
        - Apple Silicon (M-series, specify chip)
        - CPU only (no GPU)
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: training_data
    attributes:
      label: Training-data duration (minutes)
      placeholder: "e.g. 5 minutes / 12 minutes"

  - type: input
    id: language
    attributes:
      label: Language(s) being trained
      placeholder: "e.g. Polish + English"
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: What kind of issue?
      options:
        - Training crashes / fails to start
        - Training completes but the LoRA performs worse than baseline
        - Training completes but accuracy didn't improve enough
        - LoRA is great in language A but worse in language B
        - LoRA produces weird artefacts (specific words, accents, sounds)
        - Out-of-memory error during training
        - I'm not sure how to start (please link the docs page that confused you)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        - What were you hoping the LoRA would do better?
        - What does the post-training transcription get wrong (with examples — but DO NOT include sensitive audio content)?
        - Any errors during training (paste from log)?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Training log excerpt
      description: Paste the last ~80 lines from the LoRA training log.
      render: text
