name: 🐛 Bug Report
description: Report a problem with Brethof Voice Pro
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more specific you are, the faster we can fix it.
        **Do not include audio recordings with private content in this public issue.** If the bug only reproduces with sensitive audio, mark it and email `hello@brethof.ai`.

  - type: input
    id: version
    attributes:
      label: Brethof Voice Pro version
      description: "Help → About → Copy version (e.g. 2.0.0)"
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64 (specify distro below)
        - Windows 10 (21H2+)
        - Windows 11
        - Other / not listed
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distro + display server (Linux only)
      placeholder: "e.g. CachyOS / Wayland, or Ubuntu 24.04 / X11"

  - type: dropdown
    id: install_form
    attributes:
      label: How Voice Pro is installed
      description: "Linux ships as a single portable binary (no install); Windows ships as a per-user graphical installer."
      options:
        - Linux — portable binary
        - Windows — graphical installer
        - Other (specify in description)
    validations:
      required: true

  - type: dropdown
    id: licence
    attributes:
      label: Licence state
      options:
        - Free trial (14 days)
        - Trial expired
        - Purchased (full licence)
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Compute backend in use
      description: "Settings → Engine → Device. If you're not sure, leave it on the default."
      options:
        - CPU only
        - NVIDIA (Vulkan)
        - NVIDIA (CUDA — for LoRA training)
        - AMD (Vulkan)
        - Intel Arc (Vulkan)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Step-by-step what you did + what you saw.
      placeholder: |
        1. Opened Transcribe popup.
        2. Dropped recording.mp3 onto the file area.
        3. Selected "Translate to: Polish".
        4. Clicked Transcribe.
        5. Expected: Polish transcript + SRT.
        6. Actual: empty output / application crashed / wrong text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (last ~50 lines of the failing session)
      description: |
        Help menu → "Show log location" (or check the app's About/Diagnostics screen).
        Paste the relevant lines below. If you're not sure what's relevant, paste the last 50 lines.
      render: text

  - type: input
    id: audio_device
    attributes:
      label: Audio source / device
      description: e.g. built-in laptop mic, USB headset model, "system audio" capture
      placeholder: "e.g. Logitech H390 USB"

  - type: input
    id: language
    attributes:
      label: Language being transcribed (or "auto-detect")
      placeholder: "e.g. English / Polish / auto-detect"

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots, related issues, hunches, things you tried.
