name: 🎯 Transcription quality issue
description: "Specific accuracy problem: a word/phrase/language consistently transcribed wrong"
title: "[Quality] "
labels: ["transcription-quality", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We track transcription-quality issues by language + setup. Please be specific — "language X is bad" is hard to act on, but "this exact word gets transcribed as Y consistently when I use mic input + auto-detect" is actionable.

        **DO NOT include audio recordings with private content in this public issue.** If your example is sensitive, email `hello@brethof.ai` instead.

  - type: input
    id: version
    attributes:
      label: Brethof Voice Pro version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language being transcribed
      description: "Pick the language you selected in Voice Pro (or 'auto-detect' if you let the model pick)."
      options:
        - English
        - Polish
        - German
        - French
        - Spanish
        - Italian
        - Portuguese
        - Russian
        - Czech
        - Slovak
        - Hungarian
        - Chinese (Mandarin)
        - Chinese (other dialect — specify below)
        - Japanese
        - Korean
        - auto-detect
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Which ASR model are you running?
      description: Settings → Engine → Model. If you have a personal LoRA active, pick that.
      options:
        - Base Qwen3-ASR (default)
        - Personal LoRA fine-tune
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: input
    attributes:
      label: Audio source
      options:
        - File (drag-and-drop)
        - Microphone (Transcribe popup)
        - Microphone (Voice keyboard)
        - System audio
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: Features in use
      options:
        - label: Noise reduction (DeepFilter) ON
        - label: Hotwords list populated
        - label: Forced Aligner (word-level timestamps)
        - label: Translation enabled (specify target language below)

  - type: input
    id: hotwords_count
    attributes:
      label: Number of entries in your Hotwords list
      placeholder: "e.g. 12"

  - type: textarea
    id: examples
    attributes:
      label: Concrete examples
      description: |
        Format: "I said X" / "It transcribed Y" / "Expected Z"
        Multiple examples are very helpful. **Do not paste sensitive content.**
      placeholder: |
        Said:           "I want to send a transcription to the lawyer."
        Transcribed:    "I want to send a transcription to the law year."
        Expected:       "I want to send a transcription to the lawyer."

        Said:           "Brethof Voice Pro"
        Transcribed:    "Breath of voice pro"
        Expected:       "Brethof Voice Pro" (proper noun — added to Hotwords already, still wrong)
    validations:
      required: true

  - type: dropdown
    id: pattern
    attributes:
      label: Is the error consistent or sporadic?
      options:
        - Consistent — same wrong output every time
        - Sporadic — sometimes right, sometimes wrong
        - Only with this specific speaker / accent
        - Only with background noise
        - Other (describe below)

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Domain (medical / legal / technical jargon), accent, ambient noise, microphone setup, etc.
